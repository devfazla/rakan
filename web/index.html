<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #2d2d2d;
            padding: 20px 0;
            border-bottom: 1px solid #3d3d3d;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            color: #4ade80;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4ade80;
        }

        .status-text {
            font-size: 14px;
            color: #a0a0a0;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .sidebar {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
        }

        .chat-area {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: #a0a0a0;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .model-selector {
            width: 100%;
            padding: 10px;
            background-color: #3d3d3d;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .session-list {
            list-style: none;
        }

        .session-item {
            padding: 10px;
            background-color: #3d3d3d;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .session-item:hover {
            background-color: #4d4d4d;
        }

        .session-item.active {
            background-color: #4ade80;
            color: #1a1a1a;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            max-width: 80%;
        }

        .message.user {
            background-color: #3d3d3d;
            margin-left: auto;
        }

        .message.assistant {
            background-color: #4ade80;
            color: #1a1a1a;
        }

        .message-content {
            font-size: 14px;
            line-height: 1.5;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            background-color: #3d3d3d;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
            resize: none;
        }

        .chat-input:focus {
            outline: none;
            border-color: #4ade80;
        }

        .send-button {
            padding: 12px 24px;
            background-color: #4ade80;
            color: #1a1a1a;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background-color: #22c55e;
        }

        .send-button:disabled {
            background-color: #4d4d4d;
            cursor: not-allowed;
        }

        .agent-status {
            background-color: #3d3d3d;
            border-radius: 4px;
            padding: 12px;
            margin-top: 10px;
        }

        .agent-status-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .agent-status-label {
            color: #a0a0a0;
        }

        .agent-status-value {
            color: #4ade80;
        }

        .project-context {
            background-color: #3d3d3d;
            border-radius: 4px;
            padding: 12px;
            margin-top: 10px;
        }

        .project-context-item {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .project-context-label {
            color: #a0a0a0;
            font-weight: 600;
        }

        .project-context-value {
            color: #e0e0e0;
        }

        .theme-toggle {
            background: none;
            border: 1px solid #4d4d4d;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .theme-toggle:hover {
            background-color: #4d4d4d;
        }

        body.light-theme {
            background-color: #f5f5f5;
            color: #1a1a1a;
        }

        body.light-theme header {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }

        body.light-theme h1 {
            color: #16a34a;
        }

        body.light-theme .sidebar,
        body.light-theme .chat-area {
            background-color: #ffffff;
        }

        body.light-theme .model-selector,
        body.light-theme .chat-input {
            background-color: #f5f5f5;
            border-color: #e0e0e0;
            color: #1a1a1a;
        }

        body.light-theme .session-item {
            background-color: #f5f5f5;
        }

        body.light-theme .session-item:hover {
            background-color: #e0e0e0;
        }

        body.light-theme .session-item.active {
            background-color: #16a34a;
            color: #ffffff;
        }

        body.light-theme .message.user {
            background-color: #f5f5f5;
        }

        body.light-theme .message.assistant {
            background-color: #16a34a;
            color: #ffffff;
        }

        body.light-theme .agent-status,
        body.light-theme .project-context {
            background-color: #f5f5f5;
        }

        body.light-theme .agent-status-label,
        body.light-theme .project-context-label {
            color: #666666;
        }

        body.light-theme .agent-status-value,
        body.light-theme .project-context-value {
            color: #1a1a1a;
        }

        body.light-theme .theme-toggle {
            border-color: #e0e0e0;
            color: #1a1a1a;
        }

        body.light-theme .theme-toggle:hover {
            background-color: #e0e0e0;
        }

        body.light-theme .send-button {
            background-color: #16a34a;
        }

        body.light-theme .send-button:hover {
            background-color: #15803d;
        }

        body.light-theme .send-button:disabled {
            background-color: #cccccc;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>Local AI Platform</h1>
                <div style="display: flex; gap: 20px; align-items: center;">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span class="status-text">Connected</span>
                    </div>
                    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">Model Selection</div>
                    <select class="model-selector" id="modelSelector">
                        <option value="default">Default Model</option>
                        <option value="qwen2.5-coder-1.5b">Qwen2.5-Coder 1.5B</option>
                        <option value="qwen2.5-coder-3b">Qwen2.5-Coder 3B</option>
                    </select>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">Sessions</div>
                    <ul class="session-list" id="sessionList">
                        <li class="session-item active">New Session</li>
                    </ul>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">Agent Status</div>
                    <div class="agent-status">
                        <div class="agent-status-item">
                            <span class="agent-status-label">Status:</span>
                            <span class="agent-status-value">Idle</span>
                        </div>
                        <div class="agent-status-item">
                            <span class="agent-status-label">Tasks:</span>
                            <span class="agent-status-value">0</span>
                        </div>
                        <div class="agent-status-item">
                            <span class="agent-status-label">Memory:</span>
                            <span class="agent-status-value">0 items</span>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">Project Context</div>
                    <div class="project-context">
                        <div class="project-context-item">
                            <span class="project-context-label">Project:</span>
                            <span class="project-context-value">local-ai</span>
                        </div>
                        <div class="project-context-item">
                            <span class="project-context-label">Type:</span>
                            <span class="project-context-value">Python</span>
                        </div>
                        <div class="project-context-item">
                            <span class="project-context-label">Files:</span>
                            <span class="project-context-value">98</span>
                        </div>
                        <div class="project-context-item">
                            <span class="project-context-label">Git:</span>
                            <span class="project-context-value">Not initialized</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-messages" id="chatMessages">
                    <div class="message assistant">
                        <div class="message-content">
                            Hello! I'm your local AI assistant. How can I help you today?
                        </div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <textarea class="chat-input" id="chatInput" placeholder="Type your message here..." rows="1"></textarea>
                    <button class="send-button" id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';
        let currentSessionId = null;

        // DOM Elements
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const chatMessages = document.getElementById('chatMessages');
        const modelSelector = document.getElementById('modelSelector');
        const sessionList = document.getElementById('sessionList');

        // Event Listeners
        sendButton.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        modelSelector.addEventListener('change', (e) => {
            console.log('Model changed to:', e.target.value);
        });

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        let isDarkTheme = true;

        themeToggle.addEventListener('click', () => {
            isDarkTheme = !isDarkTheme;
            if (isDarkTheme) {
                document.body.classList.remove('light-theme');
                themeToggle.textContent = '🌙 Dark';
            } else {
                document.body.classList.add('light-theme');
                themeToggle.textContent = '☀️ Light';
            }
        });

        // Send Message Function
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage('user', message);
            chatInput.value = '';
            sendButton.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        model: modelSelector.value,
                        session_id: currentSessionId,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentSessionId = data.session_id;
                    addMessage('assistant', data.response);
                } else {
                    addMessage('assistant', 'Error: Failed to get response from server');
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('assistant', 'Error: Could not connect to server. Make sure the API server is running.');
            } finally {
                sendButton.disabled = false;
            }
        }

        // Add Message to Chat
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Check Server Health
        async function checkServerHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                if (response.ok) {
                    const data = await response.json();
                    console.log('Server health:', data);
                    return true;
                }
            } catch (error) {
                console.error('Server health check failed:', error);
                return false;
            }
            return false;
        }

        // Initialize
        checkServerHealth();
    </script>
</body>
</html>
