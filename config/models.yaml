  verify_checksum: true
  
  # Test model loading after download
  test_loading: true
  
  # Run basic inference test
  test_inference: true
  
  # Maximum download time (seconds)
  download_timeout: 3600
  
  # Retry attempts for failed downloads
  retry_attempts: 3
  
  # Retry delay (seconds)
  retry_delay: 5
